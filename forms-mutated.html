<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <title>Forms Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 12px; padding: 10px 20px; cursor: pointer; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .result { margin-top: 16px; padding: 12px; background: #e8f5e9; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h1>Forms Fixture</h1>

  <!-- Simple login form -->
  <div class="wrapper-wrap_930d0e73" data-mutation="structural-wrapper"><fieldset>
    <legend>Login Form</legend>
    <div class="wrapper-wrap_28f6d905" data-mutation="structural-wrapper"><form id="login-form" onsubmit="handleLogin(event)">
      <label for="login-email">Email</label>
      <div class="wrapper-wrap_cd3a196a" data-mutation="structural-wrapper"><input id="login-email" name="email" type="email" placeholder="you@example.com" data-testid="login-email" data-truth-id="login-email" aria-label="Email address" required=""></div>

      <label for="login-password">Password</label>
      <div class="wrapper-wrap_0b139fa4" data-mutation="structural-wrapper"><input id="login-password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" data-testid="login-password" data-truth-id="login-password" required=""></div>

      <label>
        <div class="wrapper-wrap_7c4485fa" data-mutation="structural-wrapper"><input type="checkbox" name="remember" data-testid="remember-me" data-truth-id="remember-me"></div> Remember me
      </label>

      <div class="wrapper-wrap_07070bf1" data-mutation="structural-wrapper"><button type="submit" data-testid="login-submit" data-truth-id="login-submit">Sign in</button></div>
    </form></div>
    <div id="login-result" class="result" data-testid="login-result" data-truth-id="login-result"></div>
  </fieldset></div>

  <!-- Registration form with more field types -->
  <div class="wrapper-wrap_ddf11eab" data-mutation="structural-wrapper"><fieldset>
    <legend>Registration</legend>
    <div class="wrapper-wrap_28f6d905" data-mutation="structural-wrapper"><form id="register-form" onsubmit="handleRegister(event)">
      <label for="reg-name">Full Name</label>
      <div class="wrapper-wrap_cd3a196a" data-mutation="structural-wrapper"><input id="reg-name" name="name" type="text" placeholder="Jane Doe" data-testid="reg-name" data-truth-id="reg-name"></div>

      <label for="reg-phone">Phone</label>
      <div class="wrapper-wrap_0b139fa4" data-mutation="structural-wrapper"><input id="reg-phone" name="phone" type="tel" placeholder="+1 555-0100" data-testid="reg-phone" data-truth-id="reg-phone"></div>

      <label for="reg-dob">Date of Birth</label>
      <div class="wrapper-wrap_0321f1df" data-mutation="structural-wrapper"><input id="reg-dob" name="dob" type="date" data-testid="reg-dob" data-truth-id="reg-dob"></div>

      <label for="reg-bio">Bio</label>
      <div class="wrapper-wrap_ea126d7e" data-mutation="structural-wrapper"><textarea id="reg-bio" name="bio" rows="3" placeholder="Tell us about yourself" data-testid="reg-bio" data-truth-id="reg-bio"></textarea></div>

      <label>Gender</label>
      <label><div class="wrapper-wrap_1ecc0d92" data-mutation="structural-wrapper"><input type="radio" name="gender" value="female" data-truth-id="gender-female"></div> Female</label>
      <label><div class="wrapper-wrap_1ecc0d92" data-mutation="structural-wrapper"><input type="radio" name="gender" value="male" data-truth-id="gender-male"></div> Male</label>
      <label><div class="wrapper-wrap_1ecc0d92" data-mutation="structural-wrapper"><input type="radio" name="gender" value="other" data-truth-id="gender-other"></div> Other</label>

      <label for="reg-file">Profile Photo</label>
      <div class="wrapper-wrap_de4a6e15" data-mutation="structural-wrapper"><input id="reg-file" name="photo" type="file" accept="image/*" data-testid="reg-file" data-truth-id="reg-file"></div>

      <div class="wrapper-wrap_21604733" data-mutation="structural-wrapper"><button type="submit" data-testid="reg-submit" data-truth-id="reg-submit">Register</button></div>
    </form></div>
    <div id="register-result" class="result" data-testid="register-result" data-truth-id="register-result"></div>
  </fieldset></div>

  <!-- Sensitive fields for redaction testing -->
  <div class="wrapper-wrap_89f0a408" data-mutation="structural-wrapper"><fieldset>
    <legend>Payment (redaction test)</legend>
    <div class="wrapper-wrap_28f6d905" data-mutation="structural-wrapper"><form id="payment-form" onsubmit="event.preventDefault()">
      <label for="cc-number">Card Number</label>
      <div class="wrapper-wrap_cd3a196a" data-mutation="structural-wrapper"><input id="cc-number" name="cc-number" autocomplete="cc-number" placeholder="4111 1111 1111 1111" data-testid="cc-number" data-truth-id="cc-number"></div>

      <label for="cc-cvv">CVV</label>
      <div class="wrapper-wrap_0b139fa4" data-mutation="structural-wrapper"><input id="cc-cvv" name="cvv" type="password" placeholder="123" data-testid="cc-cvv" data-truth-id="cc-cvv"></div>

      <label for="ssn">SSN</label>
      <div class="wrapper-wrap_0321f1df" data-mutation="structural-wrapper"><input id="ssn" name="ssn" placeholder="123-45-6789" data-testid="ssn-field" data-truth-id="ssn-field"></div>

      <label for="api-token">API Token</label>
      <div class="wrapper-wrap_5fd568f1" data-mutation="structural-wrapper"><input id="api-token" name="api_token" placeholder="sk_live_..." data-testid="api-token" data-truth-id="api-token"></div>
    </form></div>
  </fieldset></div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const el = document.getElementById('login-result');
      el.textContent = `Logged in as ${fd.get('email')}`;
      el.style.display = 'block';
    }
    function handleRegister(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const el = document.getElementById('register-result');
      el.textContent = `Registered ${fd.get('name')}`;
      el.style.display = 'block';
    }
  </script>


</body></html>
